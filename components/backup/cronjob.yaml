apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-backup
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:18.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  FILE=/backup/todos-$(date -u +%Y%m%d-%H%M%S).sql
                  pg_dump --file="$FILE"
                  ls -l "$FILE"
              env:
                - name: PGHOST
                  value: postgres-svc
                - name: PGUSER
                  value: postgres
                - name: PGDATABASE
                  value: todos
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: todo-backup-pvc
