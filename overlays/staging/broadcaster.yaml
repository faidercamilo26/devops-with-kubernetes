# In staging the broadcaster only logs the messages: it has no WEBHOOK_URL, so nothing is forwarded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
spec:
  template:
    spec:
      containers:
        - name: broadcaster
          env:
            - name: NATS_SUBJECT
              value: todos.events.staging
            - name: WEBHOOK_URL
              $patch: delete
