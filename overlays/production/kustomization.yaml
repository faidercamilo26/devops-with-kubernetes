apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
components:
  - ../../components/backup
patches:
  - path: broadcaster.yaml
  - path: backend.yaml
  - target:
      kind: Ingress
      name: todo-app-ingress
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: production.localhost
