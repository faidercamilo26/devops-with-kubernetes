# Requires the secret below, created in the cluster (not stored in this repo).
# It holds the URL of the external chat service:
#   kubectl create secret generic broadcaster-secret -n project --from-literal=WEBHOOK_URL=<url>
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: broadcaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: PROJECT/BROADCASTER
          env:
            - name: NATS_URL
              value: nats://my-nats.nats.svc.cluster.local:4222
            - name: NATS_SUBJECT
              value: todos.events
            - name: NATS_QUEUE
              value: broadcaster
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: broadcaster-secret
                  key: WEBHOOK_URL
          resources:
            requests:
              cpu: "5m"
              memory: "24Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
