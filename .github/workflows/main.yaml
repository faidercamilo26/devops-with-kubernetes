name: Build and publish application

on:
  push:
    branches:
      - main

env:
  REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        run: |-
          docker build --tag "$REGISTRY_USER/todo-app:$GITHUB_SHA" ./todo-app
          docker build --tag "$REGISTRY_USER/todo-backend:$GITHUB_SHA" ./todo-backend
          docker build --tag "$REGISTRY_USER/broadcaster:$GITHUB_SHA" ./broadcaster
          docker push "$REGISTRY_USER/todo-app:$GITHUB_SHA"
          docker push "$REGISTRY_USER/todo-backend:$GITHUB_SHA"
          docker push "$REGISTRY_USER/broadcaster:$GITHUB_SHA"

      - name: Checkout config repository
        uses: actions/checkout@v7
        with:
          repository: faidercamilo26/devops-with-kubernetes-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      # kustomize comes preinstalled on ubuntu-latest.
      - name: Use right images
        working-directory: config/base
        run: |-
          kustomize edit set image             PROJECT/TODO_APP="$REGISTRY_USER/todo-app:$GITHUB_SHA"             PROJECT/TODO_BACKEND="$REGISTRY_USER/todo-backend:$GITHUB_SHA"             PROJECT/BROADCASTER="$REGISTRY_USER/broadcaster:$GITHUB_SHA"

      # ArgoCD watches the config repository and deploys the change by itself.
      - name: Commit kustomization.yaml to the config repository
        uses: EndBug/add-and-commit@v10
        with:
          cwd: config
          add: 'base/kustomization.yaml'
          message: New version released ${{ github.sha }}
