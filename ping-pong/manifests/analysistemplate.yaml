apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  namespace: exercises
  name: cpu-usage
spec:
  metrics:
    - name: cpu-usage
      interval: 30s
      count: 3
      failureLimit: 0
      # The update is rolled back if the CPU used by all containers of the namespace,
      # as a rate over 5 minutes, goes above 0.3 cores.
      successCondition: result < 0.3
      provider:
        prometheus:
          address: http://prom-prometheus-server.monitoring.svc.cluster.local
          query: |
            scalar(
              sum(rate(container_cpu_usage_seconds_total{namespace="exercises", container!=""}[5m]))
            )
