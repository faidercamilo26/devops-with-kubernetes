apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-log
          emptyDir: {}
      containers:
        - name: log-writer
          image: faidercamilo/log-output-writer:1.10
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
        - name: log-reader
          image: faidercamilo/log-output-reader:2.1
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
